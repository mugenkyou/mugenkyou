<svg xmlns="http://www.w3.org/2000/svg" width="420" height="185" viewBox="0 0 420 185" fill="none">
  <style>
    .card-title { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #00E5FF; }
    .lang-name { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>
  <rect width="420" height="185" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="25" y="32" class="card-title">Most Used Languages</text>
  <g transform="translate(25, 48)">
    <rect width="370" height="8" rx="4" fill="#161b22"/>
    <clipPath id="bar-clip">
      <rect width="370" height="8" rx="4"/>
    </clipPath>
    <g clip-path="url(#bar-clip)">
      <rect x="0.00" y="0" width="318.75" height="8" fill="#3572A5"/>
      <rect x="318.75" y="0" width="16.50" height="8" fill="#8A2BE2"/>
      <rect x="335.26" y="0" width="10.62" height="8" fill="#f1e05a"/>
      <rect x="345.88" y="0" width="9.69" height="8" fill="#e34c26"/>
      <rect x="355.57" y="0" width="7.66" height="8" fill="#FFBD2E"/>
      <rect x="363.23" y="0" width="6.77" height="8" fill="#563d7c"/>
    </g>
  </g>
  <g transform="translate(25, 82)">
    <circle cx="5" cy="6" r="5" fill="#3572A5"/>
    <text x="16" y="10" class="lang-name">Python</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">86.15%</text>
  </g>
  <g transform="translate(215, 82)">
    <circle cx="5" cy="6" r="5" fill="#8A2BE2"/>
    <text x="16" y="10" class="lang-name">TypeScript</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">4.46%</text>
  </g>
  <g transform="translate(25, 110)">
    <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
    <text x="16" y="10" class="lang-name">JavaScript</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">2.87%</text>
  </g>
  <g transform="translate(215, 110)">
    <circle cx="5" cy="6" r="5" fill="#e34c26"/>
    <text x="16" y="10" class="lang-name">HTML</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">2.62%</text>
  </g>
  <g transform="translate(25, 138)">
    <circle cx="5" cy="6" r="5" fill="#FFBD2E"/>
    <text x="16" y="10" class="lang-name">Jupyter Notebook</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">2.07%</text>
  </g>
  <g transform="translate(215, 138)">
    <circle cx="5" cy="6" r="5" fill="#563d7c"/>
    <text x="16" y="10" class="lang-name">CSS</text>
    <text x="150" y="10" class="lang-pct" text-anchor="end">1.83%</text>
  </g>
</svg>